name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scripts
        run: chmod +x scripts/build-app.sh scripts/package-release.sh
      - name: Test
        run: swift test
      - name: Build app bundle
        env:
          ASTRA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ASTRA_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build-app.sh
      - name: Archive app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Astra.app dist/Astra-macOS.zip
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ASTRA_VERSION: ${{ github.ref_name }}
          ASTRA_BUILD_NUMBER: ${{ github.run_number }}
          ASTRA_SKIP_BUILD: 1
        run: |
          ASTRA_VERSION="${ASTRA_VERSION#v}" ./scripts/package-release.sh
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Astra-macOS
          path: dist/Astra-macOS.zip
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Astra-release-assets
          path: |
            dist/*.dmg
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: Astra-release-assets
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
